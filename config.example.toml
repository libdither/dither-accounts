# Copy to <data>/config.toml (the manager's data directory: --data, DITHER_ACCOUNTS_DATA, default the repo's .data)
# and edit. Every key is optional; the values shown are the defaults. A flag (--public-url) or its environment
# variable (DITHER_ACCOUNTS_PUBLIC_URL) wins over the file.

[manager]
host = "127.0.0.1"                  # the address the manager listens on; "0.0.0.0" if a proxy reaches it at a LAN or VPN address
port = 8486                         # apps, extractors and the page all reach the manager here
public_url = "http://localhost:8486" # the page as a browser opens it (behind your proxy, e.g. "https://accounts.example.net"):
                                    # its origin is the only one the page accepts writes from, and passkeys and OAuth
                                    # redirects are bound to it
web_dist = ""                       # where the built page is; empty: packages/manager/web/dist
trace = 1                           # 0: don't write the trace files under <data>/traces
errors = 1                          # 0: don't write <data>/traces/errors.ndjson (the manager's crashes and its
                                    # extractors', which the bugwatch extractor reads: docs/bugwatch.md)
launch = "auto"                     # how extractors start: "scope" (a systemd user scope each, so they outlive a
                                    # restart and the next manager adopts them), "detached", "child" (stopped with the
                                    # manager); auto: scope when it is a systemd service's main process, else child
                                    # (docs/supervisor.md)
display_backend = "x11"             # the screen sandboxes draw on: "x11" (Xvfb + x11vnc), "tigervnc" (TigerVNC's Xvnc),
                                    # "wayland" (a headless sway + wayvnc), or experimental, built from forks:
                                    # "kasmvnc" (KasmVNC's Xvnc), "wayland-tigervnc" (sway + w0vncserver). A default
                                    # picked on the manager's page wins over this one; an account's config can name its
                                    # own (displayBackend). docs/browser.md "Display backends"
prepare_bins = true                 # build the sandboxes' programs from the repo's pinned nixpkgs into <data>/bins at
                                    # start (nix/README.md); false: they are found on PATH, or where DITHER_BINS says
sleep = 1                           # 0: keep every account running. Else an account of a kind that may sleep (amazon,
                                    # venmo, schwab, privacy, claude) has its extractor stopped after its kind's idle
                                    # minutes with nothing to do, and started again by the next call, its next
                                    # scheduled pull or a keep-alive (docs/supervisor.md "Sleeping")
# sleep_idle_minutes = 20           # every kind's idle time instead of its own
# sleep_keep_alive_hours = 6        # how often a kind with a keep-alive (amazon) is woken while asleep; 0: never

# Extractors take their own settings from each account's config (on the page: Add account → More options), not here.
# A few environment variables change how the sandboxes run, for machines that need it:
#   DITHER_CHROMIUM_NO_SANDBOX=1     run Chromium without its own sandbox (inside containers that forbid it)
#   DITHER_TELEGRAM_DESKTOP=1        offer Telegram sign-in through Telegram Desktop in a sandbox (docs/telegram.md)
